[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.f_cpu = 250000000L

; Ottimizzazioni per la massima velocità del processore
build_flags = 
    -O2
    -D CORE_DEBUG_LEVEL=0
    -D USER_SETUP_LOADED=1
    -D ST7735_DRIVER=1
    -D ST7735_BLACKTAB=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160
    -D SPI_FREQUENCY=40000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D TFT_MOSI=3
    -D TFT_SCLK=2
    -D TFT_CS=1
    -D TFT_DC=4
    -D TFT_RST=5

; Librerie necessarie per il progetto
lib_deps =
    bodmer/TFT_eSPI@^2.5.31
    bodmer/TJpg_Decoder@^1.1.0
    greiman/SdFat@^2.2.2
